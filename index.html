<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professor Time Sheet</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #0f172a;
    color: #e2e8f0;
    margin: 0;
    padding: 20px;
  }
  h1 {
    text-align: center;
    color: #f8fafc;
  }
  p {
    text-align: center;
    color: #fc6363;
  }
  .bold {
    font-weight: bold;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    background-color: #1e293b;
    border-radius: 10px;
    overflow: hidden;
  }
  th, td {
    border: 1px solid #334155;
    text-align: center;
    padding: 12px;
  }
  th {
    background-color: #334155;
    color: #f8fafc;
  }
  td {
    background-color: #1e293b;
  }
  input[type="text"] {
    width: 90%;
    padding: 6px;
    margin: 2px 0;
    border: 1px solid #475569;
    border-radius: 5px;
    background-color: #0f172a;
    color: #f8fafc;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #7dd3fc;
    box-shadow: 0 0 5px #7dd3fc;
  }
  .sub-input {
    background-color: #15263c;
  }
  .slot-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  small {
    color: #94a3b8;
  }
  .terms {
    font-size: 0.85em;
    color: #94a3b8;
    text-align: center;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h1>Professor Time Sheet</h1>
<p><span class="bold">SHOWN IN YOUR LOCAL TIME</span></p>

<table>
  <thead>
    <tr id="headerRow">
      <th>Day / Time</th>
    </tr>
  </thead>
  <tbody id="scheduleBody">
    <!-- Rows generated by JS -->
  </tbody>
</table>

<p class="terms">Times are originally scheduled in EST: 4:00pm-6:00pm, 6:00pm-8:00pm, 8:00pm-10:00pm</p>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDI2bzqOCjPU__iLVIucOb8a_qu8UnZQxU",
    authDomain: "corv-sheet.firebaseapp.com",
    projectId: "corv-sheet",
    storageBucket: "corv-sheet.firebasestorage.app",
    messagingSenderId: "383327314554",
    appId: "1:383327314554:web:937aa34e7dee9a6adc11c3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
  const slotsUTC = [
    { start: "21:00", end: "23:00" },
    { start: "23:00", end: "01:00" },
    { start: "01:00", end: "03:00" }
  ];

  function formatLocalTime(utcTime) {
    const [hours, minutes] = utcTime.split(":").map(Number);
    const date = new Date();
    date.setUTCHours(hours, minutes, 0, 0);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function buildHeader() {
    const headerRow = document.getElementById("headerRow");
    slotsUTC.forEach(slot => {
      const th = document.createElement("th");
      th.textContent = `${formatLocalTime(slot.start)} - ${formatLocalTime(slot.end)}`;
      headerRow.appendChild(th);
    });
  }

  async function loadSchedule() {
    const tbody = document.getElementById("scheduleBody");
    tbody.innerHTML = "";

    for (const day of days) {
      const row = document.createElement("tr");
      const dayCell = document.createElement("td");
      dayCell.textContent = day;
      row.appendChild(dayCell);

      for (const slot of slotsUTC) {
        const slotKey = `${slot.start}-${slot.end}`;
        const cell = document.createElement("td");

        const container = document.createElement("div");
        container.className = "slot-container";

        const profInput = document.createElement("input");
        profInput.type = "text";
        profInput.placeholder = "Professor name";

        const subInput = document.createElement("input");
        subInput.type = "text";
        subInput.placeholder = "Sub name";
        subInput.className = "sub-input";

        const subLabel = document.createElement("small");

        container.appendChild(profInput);
        container.appendChild(subInput);
        container.appendChild(subLabel);
        cell.appendChild(container);
        row.appendChild(cell);

        const docRef = doc(db, "schedule", `${day}_${slotKey}`);
        onSnapshot(docRef, (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();
            profInput.value = data.main || "";
            subInput.value = data.sub || "";
          } else {
            profInput.value = "";
            subInput.value = "";
          }
        });

        profInput.addEventListener("change", async () => {
          await setDoc(docRef, { main: profInput.value, sub: subInput.value });
        });
        subInput.addEventListener("change", async () => {
          await setDoc(docRef, { main: profInput.value, sub: subInput.value });
        });
      }

      tbody.appendChild(row);
    }
  }

  buildHeader();
  loadSchedule();
</script>

</body>
</html>
